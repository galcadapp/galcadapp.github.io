<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="description" content="Soo deji Galcad app-ka Android.">
<title>Galcad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='white' stroke='%232B9BE8' stroke-width='3'/%3E%3Ctext x='32' y='39' font-family='Arial' font-weight='800' font-size='20' text-anchor='middle' fill='%232B9BE8'%3EG%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--brand:#2563eb;--ink:#112447;--muted:#687993;--line:#e3eaf5}*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}body{min-height:100svh;background:#edf2fc;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding-bottom:32px}main{width:100%;max-width:440px;margin:auto}.top{background:linear-gradient(155deg,#3077f2,#1d4ed8);color:white;padding:56px 24px 86px;text-align:center;border-radius:0 0 36px 36px}.logo{width:112px;height:112px;display:block;margin:0 auto 20px;filter:drop-shadow(0 12px 18px #102b7030)}h1{font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1.2}.platform{margin-top:8px;font-size:14px;color:#e1ebff}.card{position:relative;background:white;margin:-42px 18px 0;padding:26px 24px;border-radius:24px;box-shadow:0 14px 38px #12336b12;border:1px solid #ffffff80}.facts{display:flex;justify-content:center;gap:0;text-align:center;padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}.facts>div{width:50%}.facts>div+div{border-left:1px solid var(--line)}.facts b{display:block;font-size:16px;font-weight:650}.facts span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.primary{width:100%;min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--brand);border:0;border-radius:14px;color:white;text-decoration:none;font:700 17px system-ui;cursor:pointer}.primary:hover{background:#1d4ed8}.primary:active{transform:scale(.99)}.primary svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.progress-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.progress-top b{font-size:27px;font-variant-numeric:tabular-nums}.progress-top span{font-size:12px;color:var(--muted)}.track{height:7px;background:#e9effa;border-radius:8px;overflow:hidden;margin:15px 0 20px}.fill{height:100%;width:0;background:var(--brand);border-radius:8px}.track.indeterminate .fill{width:35%;animation:loading 1.1s infinite alternate ease-in-out}@keyframes loading{to{transform:translateX(185%)}}.secondary{display:block;margin:16px auto 0;background:none;border:0;color:var(--brand);font:600 14px system-ui;cursor:pointer;text-decoration:none;text-align:center;padding:8px}.message{font-size:13px;color:var(--muted);line-height:1.6;text-align:center;margin-top:16px}.error{color:#994f13}.ready{background:#168149}.ready:hover{background:#126b3c}[hidden]{display:none!important}:focus-visible{outline:3px solid #e5a528;outline-offset:4px}@media(min-width:600px){main{margin-top:48px}.top{border-radius:32px}}@media(prefers-reduced-motion:reduce){.track.indeterminate .fill{animation:none;width:100%;opacity:.5}}
</style>
</head>
<body>
<main>
<header class="top">
<svg class="logo" viewBox="0 0 120 120" role="img" aria-label="Galcad"><circle cx="60" cy="60" r="57" fill="#fff" stroke="#2B9BE8" stroke-width="5"/><text x="60" y="70" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-weight="800" font-size="27" fill="#2B9BE8">Galcad</text></svg>
<h1>Galcad</h1><p class="platform">Android</p>
</header>
<section class="card" aria-label="Download Galcad">
<div class="facts"><div><b id="size">APK</b><span id="sizeLabel">Faylka</span></div><div><b>Android</b><span>Qalabka</span></div></div>
<a class="primary" id="download" href="https://github.com/galcadapp/net/releases/latest/download/galcad-app.apk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg>Download</a>
<div id="progress" hidden><div class="progress-top"><b id="percent">…</b><span id="bytes">0 MB</span></div><div class="track indeterminate" id="bar" role="progressbar" aria-label="Download" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="fill"></div></div><button class="secondary" id="cancel" type="button">Cancel</button></div>
<a class="primary ready" id="save" download="galcad-app.apk" hidden>Save APK</a>
<p class="message" id="message" role="status" aria-live="polite" hidden></p>
<a class="secondary" id="fallback" href="https://github.com/galcadapp/net/releases/latest/download/galcad-app.apk" hidden>Download APK ↗</a>
<noscript><p class="message">Open → Install → Open</p></noscript>
</section>
</main>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const local = 'galcad-app.apk';
const mime = 'application/vnd.android.package-archive';
let request = null, blobURL = null, generation = 0;
const mb = n => (n / 1048576).toFixed(1) + ' MB';
function message(text, error = false) {
 $('message').textContent = text;
 $('message').hidden = !text;
 $('message').classList.toggle('error', error);
}
function idle() { $('progress').hidden = true; $('download').hidden = false; }
function failed() {
 idle(); message('Soo dejintu ma dhammaan. Isku day mar kale.', true);
 $('fallback').hidden = false;
}
$('download').addEventListener('click', event => {
 if (!/^https?:$/.test(location.protocol)) {
  message('Open → Install → Open'); return;
 }
 event.preventDefault();
 if (request) return;
 const token = ++generation;
 const x = new XMLHttpRequest(); request = x;
 $('download').hidden = true; $('progress').hidden = false;
 $('fallback').hidden = true; $('save').hidden = true; message('');
 $('percent').textContent = '…'; $('bytes').textContent = '0 MB';
 $('bar').classList.add('indeterminate'); $('bar').removeAttribute('aria-valuenow'); $('fill').style.width = '';
 x.open('GET', local); x.responseType = 'arraybuffer'; x.timeout = 120000;
 x.onprogress = e => {
  if (token !== generation) return;
  $('bytes').textContent = mb(e.loaded) + (e.lengthComputable ? ' / ' + mb(e.total) : '');
  if (e.lengthComputable && e.total > 0) {
   const percent = Math.min(99, Math.floor(e.loaded / e.total * 100));
   $('percent').textContent = percent + '%'; $('bar').classList.remove('indeterminate');
   $('bar').setAttribute('aria-valuenow', String(percent)); $('fill').style.width = percent + '%';
  }
 };
 x.onload = () => {
  if (token !== generation) return;
  request = null;
  const data = x.response;
  const signature = data ? new Uint8Array(data, 0, Math.min(4, data.byteLength)) : [];
  if (x.status < 200 || x.status >= 300 || signature[0] !== 80 || signature[1] !== 75 || signature[2] !== 3 || signature[3] !== 4) {
   // Native download does not require CORS when the APK is hosted on Releases.
   idle(); message(''); $('fallback').hidden = false;
   $('download').hidden = true; return;
  }
  if (blobURL) URL.revokeObjectURL(blobURL);
  blobURL = URL.createObjectURL(new Blob([data], {type:mime}));
  $('save').href = blobURL; $('save').hidden = false;
  $('progress').hidden = true; $('size').textContent = mb(data.byteLength);
  $('sizeLabel').textContent = 'Cabbirka';
 };
 x.onerror = x.ontimeout = () => { if (token !== generation) return; request = null; failed(); };
 x.send();
});
$('cancel').addEventListener('click', () => {
 ++generation;
 if (request) { const pending = request; request = null; pending.abort(); }
 idle(); message('');
});
$('save').addEventListener('click', () => { message('Open → Install → Open'); });
$('fallback').addEventListener('click', () => { message('Open → Install → Open'); });
})();
</script>
</body>
</html>
